<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista de tareas sencilla creada con HTML, CSS y JavaScript.">
  <title>Lista de tareas | Melany Rodriguez</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <a class="volver" href="../../index.html">← Volver al portafolio</a>
    <header>
      <span class="eyebrow">PROYECTO WEB</span>
      <h1>Mi lista de tareas</h1>
      <p>Organiza tus actividades de forma sencilla.</p>
    </header>
    <form id="task-form">
      <label class="sr-only" for="task-input">Nueva tarea</label>
      <input id="task-input" type="text" placeholder="Escribe una tarea..." maxlength="100" autocomplete="off" required>
      <button type="submit">Agregar</button>
    </form>
    <section class="summary" aria-live="polite">
      <span id="task-count">0 tareas</span>
      <button id="clear-completed" class="text-button" type="button">Borrar completadas</button>
    </section>
    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty">Aún no tienes tareas. ¡Agrega la primera!</p>
    <footer>Las tareas se guardan en este navegador.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
