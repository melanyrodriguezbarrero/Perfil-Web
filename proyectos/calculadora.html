<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .calculadora {
            background-color: white;

            width: 320px;

            padding: 25px;

            border-radius: 15px;

            box-shadow: 0 4px 15px #cccccc;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        #pantalla {
            width: 100%;
            box-sizing: border-box;

            padding: 15px;

            font-size: 25px;

            text-align: right;

            margin-bottom: 15px;

            border: 1px solid #cccccc;

            border-radius: 8px;
        }

        .botones {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;
        }

        button {
            padding: 18px;

            font-size: 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background-color: #eeeeee;
        }

        button:hover {
            background-color: #dddddd;
        }

        .operador {
            background-color: #dfe8ff;
        }

        .igual {
            background-color: #b8e0c0;
        }

        .limpiar {
            background-color: #ffd0d0;
        }

        .volver {
            display: block;

            text-align: center;

            margin-top: 20px;

            text-decoration: none;

            color: #333333;
        }

    </style>
</head>

<body>

    <div class="calculadora">

        <h1>Calculadora</h1>

        <input type="text" id="pantalla" value="0" readonly>

        <div class="botones">

            <button class="limpiar" onclick="limpiar()">C</button>

            <button onclick="agregar('/')">/</button>

            <button onclick="agregar('*')">*</button>

            <button class="operador" onclick="borrar()">⌫</button>


            <button onclick="agregar('7')">7</button>

            <button onclick="agregar('8')">8</button>

            <button onclick="agregar('9')">9</button>

            <button class="operador" onclick="agregar('-')">-</button>


            <button onclick="agregar('4')">4</button>

            <button onclick="agregar('5')">5</button>

            <button onclick="agregar('6')">6</button>

            <button class="operador" onclick="agregar('+')">+</button>


            <button onclick="agregar('1')">1</button>

            <button onclick="agregar('2')">2</button>

            <button onclick="agregar('3')">3</button>

            <button class="igual" onclick="calcular()">=</button>


            <button onclick="agregar('0')">0</button>

            <button onclick="agregar('.')">.</button>

        </div>

        <a class="volver" href="../index.html">
            ← Volver al portafolio
        </a>

    </div>


    <script>

        let pantalla = document.getElementById("pantalla");


        function agregar(valor) {

            if (pantalla.value == "0") {

                pantalla.value = valor;

            } else {

                pantalla.value = pantalla.value + valor;

            }
        }


        function limpiar() {

            pantalla.value = "0";

        }


        function borrar() {

            pantalla.value = pantalla.value.slice(0, -1);

            if (pantalla.value == "") {

                pantalla.value = "0";

            }

        }


        function calcular() {

            try {

                let resultado = eval(pantalla.value);

                pantalla.value = resultado;

            } catch {

                pantalla.value = "Error";

            }

        }

    </script>

</body>

</html>
