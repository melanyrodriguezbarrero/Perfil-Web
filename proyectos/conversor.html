<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conversor de unidades</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.contenedor {
    background-color: white;
    width: 100%;
    max-width: 450px;

    padding: 30px;

    border-radius: 15px;

    box-shadow: 0 4px 15px #cccccc;
}

h1 {
    text-align: center;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    box-sizing: border-box;

    padding: 12px;

    border: 1px solid #cccccc;
    border-radius: 8px;

    font-size: 16px;
}

button {
    width: 100%;

    margin-top: 20px;

    padding: 13px;

    border: none;
    border-radius: 8px;

    background-color: #b8e0c0;

    font-size: 16px;

    cursor: pointer;
}

button:hover {
    background-color: #9fd3a8;
}

.resultado {
    margin-top: 20px;

    padding: 15px;

    background-color: #eef7ee;

    border-radius: 8px;

    text-align: center;

    font-size: 18px;

    font-weight: bold;
}

.volver {
    display: block;

    text-align: center;

    margin-top: 20px;

    text-decoration: none;

    color: #333333;
}

</style>

</head>

<body>

<div class="contenedor">

    <h1>Conversor de unidades</h1>

    <label>Valor</label>

    <input type="number" id="valor" placeholder="Escribe un valor">

    <label>Convertir de</label>

    <select id="de">

        <option value="metros">Metros</option>

        <option value="centimetros">Centímetros</option>

        <option value="kilogramos">Kilogramos</option>

        <option value="gramos">Gramos</option>

        <option value="litros">Litros</option>

        <option value="mililitros">Mililitros</option>

    </select>

    <label>Convertir a</label>

    <select id="a">

        <option value="centimetros">Centímetros</option>

        <option value="metros">Metros</option>

        <option value="gramos">Gramos</option>

        <option value="kilogramos">Kilogramos</option>

        <option value="mililitros">Mililitros</option>

        <option value="litros">Litros</option>

    </select>

    <button onclick="convertir()">Convertir</button>

    <div class="resultado" id="resultado">
        Resultado
    </div>

    <a class="volver" href="../index.html">
        ← Volver al portafolio
    </a>

</div>

<script>

function convertir() {

    let valor = parseFloat(document.getElementById("valor").value);

    let de = document.getElementById("de").value;

    let a = document.getElementById("a").value;

    let resultado = document.getElementById("resultado");

    if (isNaN(valor)) {

        resultado.textContent = "Escribe un valor";

        return;
    }

    let convertido;

    if (de == "metros" && a == "centimetros") {

        convertido = valor * 100;

    } else if (de == "centimetros" && a == "metros") {

        convertido = valor / 100;

    } else if (de == "kilogramos" && a == "gramos") {

        convertido = valor * 1000;

    } else if (de == "gramos" && a == "kilogramos") {

        convertido = valor / 1000;

    } else if (de == "litros" && a == "mililitros") {

        convertido = valor * 1000;

    } else if (de == "mililitros" && a == "litros") {

        convertido = valor / 1000;

    } else if (de == a) {

        convertido = valor;

    } else {

        resultado.textContent = "No se puede realizar esta conversión";

        return;
    }

    resultado.textContent = "Resultado: " + convertido;

}

</script>

</body>
</html>
